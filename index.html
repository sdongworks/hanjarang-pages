<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한자랑 — 한자를 외우지 마세요, 발견하게 하세요</title>
<meta name="description" content="아이가 이미 아는 단어 속에서 한자를 발견하는 미취학 아동용 한자 학습 앱. 광고 없음, 개인정보 수집 없음, 오프라인 동작.">
<style>
  :root {
    --cream: #FFF6E9;
    --blue: #BFE3F2;
    --green: #CDEAC0;
    --orange: #FFD9A0;
    --ink: #4A4039;
    --ink-soft: #8C7E72;
    --highlight: #FF8A4C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.7;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; text-align: center; }
  .hanja { font-size: 88px; font-weight: 900; line-height: 1.1; margin-top: 28px; }
  h1 { font-size: 34px; font-weight: 900; margin: 8px 0 6px; }
  .tagline { font-size: 17px; color: var(--ink-soft); margin-bottom: 28px; }
  .connect {
    background: #fff;
    border-radius: 24px;
    padding: 22px;
    margin: 0 auto 28px;
    max-width: 480px;
    font-size: 22px;
    font-weight: 800;
  }
  .connect .hl { color: var(--highlight); font-weight: 900; }
  .connect .arrow { color: var(--ink-soft); font-size: 15px; font-weight: 400; display: block; margin-top: 4px; }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 32px; }
  .card {
    border-radius: 20px;
    padding: 16px 18px;
    font-size: 15px;
    font-weight: 700;
    flex: 1 1 200px;
    max-width: 230px;
  }
  .c1 { background: var(--blue); }
  .c2 { background: var(--green); }
  .c3 { background: var(--orange); }
  .store {
    display: inline-block;
    background: var(--highlight);
    color: #fff;
    font-weight: 800;
    font-size: 17px;
    border-radius: 28px;
    padding: 14px 32px;
    text-decoration: none;
    margin-bottom: 10px;
  }
  .store-note { font-size: 13px; color: var(--ink-soft); margin-bottom: 40px; }
  footer { font-size: 13.5px; color: var(--ink-soft); }
  footer a { color: var(--highlight); text-decoration: none; }
  footer .links { margin-bottom: 6px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hanja">水</div>
  <h1>한자랑</h1>
  <p class="tagline">한자를 외우지 마세요, 발견하게 하세요</p>

  <div class="connect">
    <span class="hl">수</span>영 · <span class="hl">수</span>박 · <span class="hl">수</span>요일
    <span class="arrow">아이가 아는 단어 속에 이미 한자가 숨어 있어요</span>
  </div>

  <div class="cards">
    <div class="card c1">🔊 탭하면 들려요<br>한글 몰라도 OK</div>
    <div class="card c2">✏️ 손가락 따라쓰기<br>🃏 플래시카드 복습</div>
    <div class="card c3">🚫 광고 없음<br>📴 오프라인 동작</div>
  </div>

  <a class="store" href="https://play.google.com/store/apps/details?id=com.sdongworks.hanjarang">Google Play에서 다운로드</a>
  <p class="store-note">5~7세 미취학 아동 · 요일과 숫자 17자 무료</p>

  <footer>
    <div class="links">
      <a href="privacy.html">개인정보처리방침</a> ·
      <a href="mailto:hancoding@gmail.com">문의하기</a>
    </div>
    © 2026 SdongWorks · 한자랑 (HanjaRang)
  </footer>

</div>
</body>
</html>
